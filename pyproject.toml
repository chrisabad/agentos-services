[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-services"
version = "0.1.0"
description = "Standalone HTTP services for AgentOS — Memory, Attention Broker, Ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AgentOS" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/memory/tests", "services/broker/tests", "services/feedback/tests", "services/router/tests"]

[tool.setuptools.package-data]
"services.router" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"